name: Temporary frontend dependency repair
on:
  push:
    branches: [chore/ci-frontend-diagnostic-20261111]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ci-frontend-diagnostic-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore missing declared frontend dependencies and test build
        working-directory: frontend
        run: |
          npm install --save-exact framer-motion recharts jspdf --ignore-scripts
          npm ci --no-audit --no-fund
          npm run build
      - name: Persist tested package manifest and lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(frontend): declare missing report dependencies"
            git push origin HEAD:chore/ci-frontend-diagnostic-20261111
          fi

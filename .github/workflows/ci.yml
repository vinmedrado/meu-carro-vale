name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:///mcv_ci.db
      JWT_SECRET: ci-only-secret-key-with-at-least-32-characters
      PAGARME_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend alembic
      - run: python -m pytest backend/tests -q

  data-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcv-data-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q api config jobs scripts tests vehicle_catalog
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

name: Temporary frontend security dependency refresh
on:
  push:
    branches: [fix/frontend-dependency-audit-20261111]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-dependency-audit-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin patched Vite and update nonbreaking vulnerable transitive dependencies
        working-directory: frontend
        run: |
          npm install --save-dev --save-exact vite@8.3.8 --ignore-scripts --no-fund
          npm audit fix --ignore-scripts --no-fund
      - name: Verify clean reproducible build and dependency audit
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          npm audit --audit-level=high
      - name: Save tested package and lockfile on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): update Vite and audited frontend dependencies"
            git push origin HEAD:fix/frontend-dependency-audit-20261111
          fi
